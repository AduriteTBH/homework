<!DOCTYPE html>
<html lang="en-us">
<head>
<meta charset="utf-8"><meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<title>60 Seconds - Web</title>
<link rel="shortcut icon" href="https://cdn.jsdelivr.net/gh/usheje883-maker/60-Seconds-Webport@main/Image.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/usheje883-maker/60-Seconds-Webport@main/TemplateData/style.css">
</head>
<body>
<div id="unity-container" class="unity-desktop"><canvas id="unity-canvas"></canvas><div id="unity-loading-bar"><div id="unity-logo"></div><div id="unity-progress-bar-empty"><div id="unity-progress-bar-full"></div></div></div><div id="unity-warning"></div></div>
<script>
var container=document.querySelector('#unity-container'),canvas=document.querySelector('#unity-canvas'),loadingBar=document.querySelector('#unity-loading-bar'),progressBarFull=document.querySelector('#unity-progress-bar-full'),warningBanner=document.querySelector('#unity-warning');
function unityShowBanner(msg,type){var div=document.createElement('div');div.innerHTML=msg;warningBanner.appendChild(div);if(type==='error')div.style='background:red;padding:10px;';else if(type==='warning'){div.style='background:yellow;padding:10px;';setTimeout(function(){if(div.parentNode)div.parentNode.removeChild(div)},5000)}}
var baseUrl='https://cdn.jsdelivr.net/gh/usheje883-maker/60-Seconds-Webport@main/',buildUrl=baseUrl+'Build',loaderUrl=buildUrl+'/Build.loader.js';
loadingBar.style.display='block';
var dataFiles=['Build.data.unityweb.0','Build.data.unityweb.1','Build.data.unityweb.2','Build.data.unityweb.3','Build.data.unityweb.4','Build.data.unityweb.5'];
Promise.all(dataFiles.map(function(f){return fetch(buildUrl+'/'+f).then(function(r){if(!r.ok)throw Error('Failed '+f);return r.arrayBuffer();})})).then(function(parts){
var total=parts.reduce(function(s,b){return s+b.byteLength},0),combined=new Uint8Array(total),off=0;parts.forEach(function(buf){combined.set(new Uint8Array(buf),off);off+=buf.byteLength;});
var dataBlob=URL.createObjectURL(new Blob([combined]));
var config={dataUrl:dataBlob,frameworkUrl:buildUrl+'/Build.framework.js.unityweb',codeUrl:buildUrl+'/Build.wasm.unityweb',streamingAssetsUrl:baseUrl+'StreamingAssets',companyName:'Robot Gentleman',productName:'60 Seconds',productVersion:'1.0',showBanner:unityShowBanner};
var script=document.createElement('script');script.src=loaderUrl;script.onload=function(){createUnityInstance(canvas,config,function(progress){progressBarFull.style.width=100*progress+'%';}).then(function(){loadingBar.style.display='none';}).catch(function(message){unityShowBanner(message,'error');});};document.body.appendChild(script);
}).catch(function(error){unityShowBanner(error.message,'error');});
</script>
</body></html>
