  <!--
    URL stability guard.
    Unity's `_SetUrlPostfix` JSLib (in WebGL.wasm.framework.unityweb) does
    `history.pushState(null, "", params)` — Playtika canonical SPA-analytics hook,
    triggered after match-end to ping their GA setup. In our deployment that
    truncates `/test-newver10/` to `/`, breaks reloads/bookmarks for logged-in
    users (route stack call $f91467 → _SetUrlPostfix → pushState; verified
    via wasm framework decompression + log stack 2026-05-20).
    Trap pushState/replaceState and skip any call originating from _SetUrlPostfix.
    Other history.pushState (eg. legit SPA routing if added later) still works.
  -->
  <script>
  (function(){
    var _origPush = history.pushState;
    var _origReplace = history.replaceState;
    function _isUnityUrlTrack() {
      var stack = '';
      try { throw new Error(); } catch (e) { stack = e.stack || ''; }
      return stack.indexOf('_SetUrlPostfix') !== -1;
    }
    history.pushState = function(state, title, url) {
      if (_isUnityUrlTrack()) {
        // Unity Playtika analytics hook — suppress URL mutation; canonical client
        // doesn't read URL state, so this is a pure JS-side side effect we don't want.
        return;
      }
      return _origPush.apply(history, arguments);
    };
    history.replaceState = function(state, title, url) {
      if (_isUnityUrlTrack()) return;
      return _origReplace.apply(history, arguments);
    };
  })();
  </script>

  <!--
    Dev utility: ?reset_idb=1 nukes Unity's IDBFS databases (where Unity WebGL stores
    PlayerPrefs in 4.23). Needed when clearing localStorage alone is insufficient —
    e.g. BPSeason{N}PopupShown is in PlayerPrefs, so the BP "New Season" banner stays
    suppressed across reloads even after a hard refresh. After reset, page auto-reloads
    so Unity starts cold and the popup re-triggers.
  -->
  <script>
  (function(){
    if (location.search.indexOf('reset_idb=1') === -1) return;
    if (sessionStorage.getItem('_idb_just_reset') === '1') {
      sessionStorage.removeItem('_idb_just_reset');
      console.log('[DEV] IDBFS reset complete — Unity will start cold');
      return;
    }
    console.log('[DEV] reset_idb=1 → wiping Unity IDBFS PlayerPrefs');
    var done = function(){
      sessionStorage.setItem('_idb_just_reset', '1');
      var url = location.pathname + location.search.replace(/[?&]reset_idb=1/, '').replace(/^&/, '?');
      location.replace(url || location.pathname);
    };
    try {
      if (indexedDB.databases) {
        indexedDB.databases().then(function(dbs){
          var pending = 0, finished = false;
          dbs.forEach(function(d){
            if (!d.name) return;
            pending++;
            var req = indexedDB.deleteDatabase(d.name);
            req.onsuccess = req.onerror = req.onblocked = function(){
              if (--pending === 0 && !finished) { finished = true; done(); }
            };
          });
          if (pending === 0) done();
        }).catch(done);
      } else {
        // Older browsers — best-effort: try common Unity 4.23 paths.
        ['/idbfs','UnityCache'].forEach(function(n){ try { indexedDB.deleteDatabase(n); } catch(e){} });
        setTimeout(done, 500);
      }
    } catch (e) { done(); }
  })();
  </script>
