<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hopter Royale</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>
    <div id="menu-screen" class="screen">
        <h1>Hopter Royale</h1>
        <div class="panel">
            <p style="color: #7f8fa6; font-weight: bold; margin-bottom: 5px;">Callsign:</p>
            <h2 id="player-name-display" style="font-size: 2rem;">Loading...</h2>
            <button id="btn-cycle-name">Roll New Name</button>
            <hr>
            <button id="btn-create-game" class="primary">Deploy as Host</button>
            <hr>
            <div class="join-section">
                <input type="text" id="join-code-input" placeholder="5-LETTER CODE" maxlength="5">
                <button id="btn-join-game">Join Squad</button>
            </div>
            <p id="menu-status" class="error-text"></p>
        </div>
    </div>

    <div id="lobby-screen" class="screen hidden">
        <h1>Briefing Room</h1>
        <div class="panel">
            <h2 id="room-code-display" style="font-size: 2.5rem; letter-spacing: 4px;">Code: -----</h2>
            <p style="color: #7f8fa6; margin-top: 15px;">Pilots Connected:</p>
            <ul id="player-list"></ul>
            <button id="btn-start-game" class="primary hidden">Launch Mission</button>
            <p id="lobby-status"></p>
        </div>
    </div>

    <div id="game-ui" class="hidden">
        <div id="hud-top-left">
            <div id="hud-alive">Pilots Alive: 0</div>
        </div>
        
        <div id="minimap-container">
            <canvas id="minimapCanvas" width="150" height="150"></canvas>
        </div>

        <div id="hud-bottom">
            <div id="hud-hp-bar-bg"><div id="hud-hp-bar"></div></div>
            <div id="hud-xp-bar-bg"><div id="hud-xp-bar"></div></div>
            <div id="hud-level">Level: 1</div>
        </div>
        <div id="game-over-screen" class="hidden">
            <h2 id="game-over-text">KIA</h2>
            <button onclick="location.reload()" class="primary">Return to Base</button>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script src="game.js"></script>
</body>
</html>
