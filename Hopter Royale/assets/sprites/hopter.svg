<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <!-- Top-down hopter  faces RIGHT (+X). Tint via CSS/canvas multiply. -->
  <defs>
    <linearGradient id="hull" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.25"/>
    </linearGradient>
  </defs>
  <!-- Main rotor disc -->
  <ellipse cx="64" cy="64" rx="58" ry="10" fill="#ffffff" fill-opacity="0.18" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2"/>
  <!-- Rotor blades -->
  <g stroke="#ffffff" stroke-opacity="0.92" stroke-width="4" stroke-linecap="round">
    <line x1="20" y1="64" x2="108" y2="64"/>
    <line x1="64" y1="20" x2="64" y2="108"/>
  </g>
  <!-- Tail boom -->
  <rect x="8" y="58" width="28" height="12" rx="4" fill="#334155"/>
  <!-- Tail rotor -->
  <ellipse cx="12" cy="64" rx="4" ry="10" fill="#64748b" stroke="#94a3b8" stroke-width="1"/>
  <!-- Fuselage -->
  <ellipse cx="64" cy="64" rx="34" ry="26" fill="#4cd137" stroke="#ffffff" stroke-opacity="0.4" stroke-width="2"/>
  <ellipse cx="64" cy="64" rx="34" ry="26" fill="url(#hull)"/>
  <!-- Cockpit -->
  <ellipse cx="72" cy="58" rx="14" ry="10" fill="#0ea5e9" fill-opacity="0.55" stroke="#7dd3fc" stroke-width="1.5"/>
  <!-- Nose / weapon -->
  <rect x="92" y="60" width="22" height="8" rx="3" fill="#64748b" stroke="#94a3b8" stroke-width="1"/>
  <rect x="110" y="61" width="10" height="6" rx="2" fill="#475569"/>
  <!-- Hub -->
  <circle cx="64" cy="64" r="8" fill="#1e293b" stroke="#5ecfff" stroke-width="1.5"/>
</svg>
