<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Learn to Fly</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #09090b;
      color: #f4f4f5;
      font-family: system-ui, -apple-system, sans-serif;
      display: grid;
      place-items: center;
    }
    .panel {
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding: 28px;
      border-radius: 14px;
      background: #141417;
      border: 1px solid #27272a;
      min-width: 280px;
      text-align: center;
    }
    h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 600;
    }
    .actions {
      display: flex;
      gap: 10px;
      justify-content: center;
    }
    a {
      text-decoration: none;
      color: #09090b;
      background: #f4f4f5;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      transition: opacity 0.15s ease;
    }
    a:hover {
      opacity: 0.88;
    }
  </style>
</head>
<body>
  <div class="panel">
    <h1>Choose Learn to Fly Version</h1>
    <div class="actions">
      <a href="2/index.html">Learn to Fly 2</a>
      <a href="3/index.html">Learn to Fly 3</a>
    </div>
  </div>
</body>
</html>
