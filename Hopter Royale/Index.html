<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hopter Royale</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>
    <div id="menu-screen" class="screen">
        <h1>Hopter Royale</h1>
        <div class="panel">
            <p>Player Name:</p>
            <h2 id="player-name-display">Loading...</h2>
            <button id="btn-cycle-name">Cycle Name</button>
            <hr>
            <button id="btn-create-game" class="primary">Create Game (Host)</button>
            <hr>
            <div class="join-section">
                <input type="text" id="join-code-input" placeholder="5-Letter Code" maxlength="5">
                <button id="btn-join-game">Join Game</button>
            </div>
            <p id="menu-status" class="error-text"></p>
        </div>
    </div>

    <div id="lobby-screen" class="screen hidden">
        <h1>Lobby</h1>
        <div class="panel">
            <h2 id="room-code-display">Code: -----</h2>
            <p>Players Connected:</p>
            <ul id="player-list"></ul>
            <button id="btn-start-game" class="primary hidden">Start Game</button>
            <p id="lobby-status"></p>
        </div>
    </div>

    <div id="game-ui" class="hidden">
        <div id="hud-top-left">
            <div id="hud-alive">Players Alive: 0</div>
        </div>
        <div id="hud-bottom">
            <div id="hud-hp-bar-bg"><div id="hud-hp-bar"></div></div>
            <div id="hud-xp-bar-bg"><div id="hud-xp-bar"></div></div>
            <div id="hud-level">Level: 1</div>
        </div>
        <div id="game-over-screen" class="hidden">
            <h2 id="game-over-text">You Died</h2>
            <button onclick="location.reload()">Return to Menu</button>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script src="game.js"></script>
</body>
</html>
