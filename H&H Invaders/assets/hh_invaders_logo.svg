<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="100%">
    <defs>
        <!-- Background Glow -->
        <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="8" result="blur" />
            <feMerge>
                <feMergeNode in="blur" />
                <feMergeNode in="blur" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>
        
        <filter id="subtle-glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="3" result="blur" />
            <feMerge>
                <feMergeNode in="blur" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>

        <!-- Gradient for H&H -->
        <linearGradient id="hh-grad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#00ffff" />
            <stop offset="50%" stop-color="#0088ff" />
            <stop offset="100%" stop-color="#0033cc" />
        </linearGradient>

        <!-- Gradient for INVADERS -->
        <linearGradient id="inv-grad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#ff0055" />
            <stop offset="50%" stop-color="#ff00aa" />
            <stop offset="100%" stop-color="#aa00ff" />
        </linearGradient>
    </defs>

    <!-- Sci-fi Accents (Wings / Lines) -->
    <g transform="translate(400, 100)" filter="url(#subtle-glow)">
        <path d="M -350 -10 L -250 -10 L -230 10 L 230 10 L 250 -10 L 350 -10" fill="none" stroke="#00ffff" stroke-width="2" opacity="0.6"/>
        <path d="M -300 25 L -200 25 L -180 40 L 180 40 L 200 25 L 300 25" fill="none" stroke="#ff0055" stroke-width="1.5" opacity="0.4"/>
        <circle cx="0" cy="10" r="4" fill="#00ffff" />
        <line x1="-350" y1="-10" x2="-350" y2="-20" stroke="#00ffff" stroke-width="2"/>
        <line x1="350" y1="-10" x2="350" y2="-20" stroke="#00ffff" stroke-width="2"/>
    </g>

    <!-- Main Title: H&H -->
    <text x="400" y="75" font-family="system-ui, -apple-system, sans-serif" font-size="80" font-weight="900" fill="url(#hh-grad)" text-anchor="middle" filter="url(#neon-glow)" letter-spacing="8">
        H&amp;H
    </text>

    <!-- Subtitle: INVADERS -->
    <text x="400" y="145" font-family="system-ui, -apple-system, sans-serif" font-size="50" font-weight="bold" fill="url(#inv-grad)" text-anchor="middle" filter="url(#neon-glow)" letter-spacing="20">
        INVADERS
    </text>
    
    <!-- Crosshair Target -->
    <g transform="translate(400, 50)" opacity="0.3" stroke="#00ffff" stroke-width="1.5">
        <circle cx="0" cy="0" r="30" fill="none"/>
        <line x1="-40" y1="0" x2="40" y2="0" />
        <line x1="0" y1="-40" x2="0" y2="40" />
    </g>
</svg>
