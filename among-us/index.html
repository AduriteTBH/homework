<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,height=device-height,initial-scale=1,user-scalable=no">
  <title>Among Us</title>
  <link rel="icon" href="https://cdn.mos.cms.futurecdn.net/93GAa4wm3z4HbenzLbxWeQ.jpg">
  <style>
    html,body,#game{width:100%;height:100%;margin:0;overflow:hidden;background:#000}
    #game{position:fixed;inset:0}
    #unity-canvas{display:block;width:100%;height:100%;border:0;outline:0;background:#000}
    #loader{position:fixed;inset:0;z-index:2;display:grid;place-items:center;background:#000;color:#fff;font:16px Arial,sans-serif}
    #loader-box{width:min(440px,82vw);text-align:center}
    .download-row{margin-top:18px}
    .download-label{display:flex;justify-content:space-between;margin-bottom:6px;font-size:14px}
    .download-track{height:12px;overflow:hidden;border:1px solid #777;border-radius:8px}
    .download-fill{width:0;height:100%;background:#35d0ba;transition:width .12s linear}
    #error{margin-top:12px;color:#ff6961;white-space:pre-wrap}
  </style>
</head>
<body>
  <div id="game"><canvas id="unity-canvas" tabindex="-1"></canvas></div>
  <div id="loader">
    <div id="loader-box">
      <div id="status" role="status">Loading game files… 0%</div>
      <div class="download-row"><div class="download-label"><span>Data</span><span id="data-percent">0%</span></div><div class="download-track" role="progressbar" aria-label="Data" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="data-bar"><div class="download-fill" id="data-fill"></div></div></div>
      <div class="download-row"><div class="download-label"><span>WASM</span><span id="wasm-percent">0%</span></div><div class="download-track" role="progressbar" aria-label="WASM" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="wasm-bar"><div class="download-fill" id="wasm-fill"></div></div></div>
      <div class="download-row"><div class="download-label"><span>Assets</span><span id="assets-percent">0%</span></div><div class="download-track" role="progressbar" aria-label="Assets" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="assets-bar"><div class="download-fill" id="assets-fill"></div></div></div>
      <div id="error"></div>
    </div>
  </div>
  <script>
    const REPO_PATH = "wasmdotrip/AmongUsPort";
    const REPO_REF = "7b6881186a73a3165ad7274b5e5dd31e3290cbfc";
    const JSDELIVR = "https://cdn.jsdelivr.net/gh/" + REPO_PATH + "@" + REPO_REF;
    const WORKER_CDN_PROXY = "https://homework-socket.hnhai.workers.dev/cdn/";
    const CDN_MIRRORS = [
      "https://cdn.jsdelivr.net/gh/" + REPO_PATH + "@" + REPO_REF,
      "https://fastly.jsdelivr.net/gh/" + REPO_PATH + "@" + REPO_REF,
      "https://raw.githubusercontent.com/" + REPO_PATH + "/" + REPO_REF,
      WORKER_CDN_PROXY + "cdn.jsdelivr.net/gh/" + REPO_PATH + "@" + REPO_REF,
      WORKER_CDN_PROXY + "raw.githubusercontent.com/" + REPO_PATH + "/" + REPO_REF
    ];
    const BUILD = JSDELIVR + "/Build";
    const STREAMING_ASSETS = JSDELIVR + "/StreamingAssets";
    const LARGE_BUNDLE = "defaultlocalgroup_assets__db69efd6d6015cdfb90e3e77a7544e5b.bundle";
    const CACHE_REVISION = "7b6881186a73a3165ad7274b5e5dd31e3290cbfc-catalog2";
    const EXPECTED_DATA_BYTES = 106373377;
    const EXPECTED_WASM_BYTES = 166806921;
    const EXPECTED_BUNDLE_BYTES = 589939296;
    const MAX_CONCURRENT_DOWNLOADS = 4;
    const STREAMING_FILES = [
      ["aa/AddressablesLink/link.xml",28453,"application/xml"],
      ["aa/catalog.json",1099514,"application/json"],
      ["aa/settings.json",844,"application/json"],
      ["aa/WebGL/453b0a9b2ef9b8a4080b2014844ce426_unitybuiltinshaders_2536dfd3f978a44e0658621a7478bc60.bundle",56557,"application/octet-stream"],
      ["CustomAssetPacksData.json",137,"application/json"],
      ["UnityServicesProjectConfiguration.json",1131,"application/json"]
    ];
    const TOTAL_BYTES = 106373377 + 166806921 + 589939296 + 20642 + 523455 + STREAMING_FILES.reduce((sum,file)=>sum+file[1],0);

    const canvas=document.getElementById("unity-canvas");
    const loader=document.getElementById("loader");
    const statusText=document.getElementById("status");
    const errorText=document.getElementById("error");
    const browserFetch=window.fetch.bind(window);
    const BrowserXMLHttpRequest=window.XMLHttpRequest;
    const preloadAbort=new AbortController();
    const assetUrls=new Map();
    let downloadedBytes=0;
    let progressFrame=null;
    let loadingFailed=false;

    const downloadGroups={
      data:{total:106373377,bytes:0,complete:false},
      wasm:{total:166806921,bytes:0,complete:false},
      assets:{total:589939296+STREAMING_FILES.reduce((sum,file)=>sum+file[1],0),bytes:0,complete:false}
    };
    Object.keys(downloadGroups).forEach(name=>{
      const group=downloadGroups[name];
      group.fill=document.querySelector("#"+name+"-fill");
      group.percent=document.querySelector("#"+name+"-percent");
      group.bar=document.querySelector("#"+name+"-bar");
    });
    function renderDownloadProgress(){
      if(loadingFailed)return;
      Object.keys(downloadGroups).forEach(name=>{
        const group=downloadGroups[name];
        const progress=group.complete?1:Math.min(group.bytes/group.total,0.99);
        const percent=Math.floor(progress*100);
        group.fill.style.width=(progress*100)+"%";
        group.percent.textContent=percent+"%";
        group.bar.setAttribute("aria-valuenow",String(percent));
      });
      const progress=Math.min(downloadedBytes/TOTAL_BYTES,1);
      statusText.textContent="Loading game files… "+Math.floor(progress*100)+"%";
    }
    function recordBytes(bytes,url){
      if(loadingFailed)return;
      downloadedBytes=Math.max(0,downloadedBytes+bytes);
      const path=new URL(url,location.href).pathname;
      const name=path.includes("/StreamingAssets/")?"assets":path.endsWith(".data")||/\.data\.part\d+$/.test(path)?"data":path.endsWith(".wasm")||/\.wasm\.part\d+$/.test(path)?"wasm":null;
      if(name)downloadGroups[name].bytes=Math.max(0,downloadGroups[name].bytes+bytes);
      if(progressFrame!==null)return;
      progressFrame=requestAnimationFrame(()=>{progressFrame=null;renderDownloadProgress()});
    }
    async function finishDownloadGroup(name,promise){
      const result=await promise;
      downloadGroups[name].complete=true;
      renderDownloadProgress();
      return result;
    }

    const CACHE_DB="amongus-web-cache";
    const CACHE_STORE="files";
    let cacheDbPromise=null;
    function openCacheDb(){
      if(cacheDbPromise)return cacheDbPromise;
      cacheDbPromise=new Promise(resolve=>{
        try{
          const request=indexedDB.open(CACHE_DB,1);
          request.onupgradeneeded=()=>request.result.createObjectStore(CACHE_STORE);
          request.onsuccess=()=>resolve(request.result);
          request.onerror=request.onblocked=()=>resolve(null);
        }catch(error){resolve(null)}
      });
      return cacheDbPromise;
    }
    async function cacheGet(url){
      const db=await openCacheDb();
      if(!db)return undefined;
      return new Promise(resolve=>{
        try{
          const tx=db.transaction(CACHE_STORE,"readonly");
          const request=tx.objectStore(CACHE_STORE).get(CACHE_REVISION+":"+url);
          request.onsuccess=()=>resolve(request.result);
          request.onerror=tx.onabort=()=>resolve(undefined);
        }catch(error){resolve(undefined)}
      });
    }
    async function cacheSet(url,blob){
      const db=await openCacheDb();
      if(!db)return;
      return new Promise(resolve=>{
        try{
          const tx=db.transaction(CACHE_STORE,"readwrite");
          tx.objectStore(CACHE_STORE).put(blob,CACHE_REVISION+":"+url);
          tx.oncomplete=tx.onerror=tx.onabort=()=>resolve();
        }catch(error){resolve()}
      });
    }
    function resourceUrl(resource){return typeof resource==="string"?resource:resource instanceof URL?resource.href:resource.url}
    function assetKey(url){const target=new URL(url,location.href);target.search="";target.hash="";return target.href}
    const overrideServer=new URLSearchParams(location.search).get("server");
    let serverReplacement=null;
    if(overrideServer){try{serverReplacement=new URL(overrideServer)}catch(error){}}
    function toHttpProtocol(protocol){return protocol==="ws:"?"http:":protocol==="wss:"?"https:":protocol}
    function toWsProtocol(protocol){return protocol==="http:"?"ws:":protocol==="https:"?"wss:":protocol}
    function rewriteToServer(url,wantWs){
      if(!serverReplacement)return url;
      let target;
      try{target=new URL(url,location.href)}catch(error){return url}
      if(target.protocol==="blob:"||target.href.startsWith(JSDELIVR+"/"))return url;
      if(target.host===location.host)return url;
      target.protocol=wantWs?toWsProtocol(serverReplacement.protocol):toHttpProtocol(serverReplacement.protocol);
      target.host=serverReplacement.host;
      return target.toString();
    }
    function externalFetch(url,resource,options){
      const sourceHeaders=options&&options.headers?options.headers:(typeof Request!=="undefined"&&resource instanceof Request?resource.headers:undefined);
      const headers=new Headers(sourceHeaders||undefined);
      headers.delete("Authorization");
      headers.delete("Proxy-Authorization");
      headers.delete("Content-Type");
      return browserFetch(url,Object.assign({},options||{},{method:(options&&options.method)||(typeof Request!=="undefined"&&resource instanceof Request?resource.method:"GET"),headers,credentials:"omit"}));
    }
    async function cacheDelete(url){
      const db=await openCacheDb();
      if(!db)return;
      return new Promise(resolve=>{
        try{
          const tx=db.transaction(CACHE_STORE,"readwrite");
          tx.objectStore(CACHE_STORE).delete(CACHE_REVISION+":"+url);
          tx.oncomplete=tx.onerror=tx.onabort=()=>resolve();
        }catch(error){resolve()}
      });
    }
    function toMirrorUrls(url){
      const s=String(url);
      if(!s.startsWith(JSDELIVR+"/"))return [s];
      const suffix=s.slice(JSDELIVR.length);
      return CDN_MIRRORS.map(base=>base+suffix);
    }
    function isHtmlContentType(res){
      const ct=(res.headers.get("content-type")||"").toLowerCase();
      return ct.includes("text/html")||ct.includes("application/xhtml");
    }
    function isValidMirrorResponse(targetUrl,res){
      if(!res||!res.ok||isHtmlContentType(res))return false;
      if(targetUrl.startsWith(WORKER_CDN_PROXY)&&res.headers.get("x-hh-proxy")!=="1")return false;
      return true;
    }
    async function fetchWithFallback(resource,options){
      const url=resourceUrl(resource);
      const rewritten=rewriteToServer(url,false);
      if(rewritten!==url)return browserFetch(rewritten,options);
      if(url.startsWith(JSDELIVR+"/")){
        const candidates=toMirrorUrls(url);
        let lastErr;
        for(const candidate of candidates){
          try{
            const res=await externalFetch(candidate,resource,options);
            if(isValidMirrorResponse(candidate,res))return res;
            lastErr=new Error("HTTP "+res.status);
          }catch(e){lastErr=e}
        }
        if(lastErr)throw lastErr;
      }
      return url.startsWith("blob:")?externalFetch(url,resource,options):browserFetch(resource,options);
    }
    async function mapWithConcurrency(items,limit,worker){
      const results=new Array(items.length);
      let cursor=0;
      const runners=Array.from({length:Math.min(limit,items.length)},async()=>{
        while(cursor<items.length){
          const idx=cursor++;
          results[idx]=await worker(items[idx],idx);
        }
      });
      await Promise.all(runners);
      return results;
    }
    async function validateDownloadedBlob(url,blob,expectedBytes){
      if(!(blob instanceof Blob)||blob.size===0)return false;
      if(typeof expectedBytes==="number"&&blob.size!==expectedBytes)return false;
      const clean=url.split("?")[0].toLowerCase();
      if(clean.endsWith(".wasm.part1")||clean.endsWith(".wasm")){
        const head=new Uint8Array(await blob.slice(0,4).arrayBuffer());
        if(head[0]!==0x00||head[1]!==0x61||head[2]!==0x73||head[3]!==0x6d)return false;
      }
      if(!clean.endsWith(".html")&&!clean.endsWith(".htm")&&blob.size<65536){
        const headText=(await blob.slice(0,256).text()).trimStart().toLowerCase();
        if(headText.startsWith("<!doctype")||headText.startsWith("<html"))return false;
      }
      return true;
    }
    async function downloadBlob(url,mimeType,expectedBytes){
      const cached=await cacheGet(url);
      if(cached instanceof Blob){
        if(await validateDownloadedBlob(url,cached,expectedBytes)){
          recordBytes(cached.size,url);
          return cached;
        }
        await cacheDelete(url);
      }
      const candidates=toMirrorUrls(url);
      let lastError;
      for(let round=0;round<2;round++){
        for(const targetUrl of candidates){
          try{
            const response=await externalFetch(targetUrl,targetUrl,{signal:preloadAbort.signal,cache:"no-store"});
            if(!response.ok){lastError=new Error("Failed to load "+targetUrl+" (HTTP "+response.status+")");continue}
            if(!isValidMirrorResponse(targetUrl,response)){lastError=new Error("Blocked response from "+new URL(targetUrl).hostname);continue}
            const enc=(response.headers.get("content-encoding")||"").toLowerCase();
            const headerLen=Number(response.headers.get("content-length")||0);
            let blob;
            let chunkBytes=0;
            if(!response.body||!response.body.getReader){
              const buffer=await response.arrayBuffer();
              chunkBytes=buffer.byteLength;
              recordBytes(chunkBytes,url);
              blob=new Blob([buffer],{type:mimeType});
            }else{
              const reader=response.body.getReader();
              const chunks=[];
              try{
                while(true){
                  const chunk=await reader.read();
                  if(chunk.done)break;
                  chunks.push(chunk.value);
                  chunkBytes+=chunk.value.byteLength;
                  recordBytes(chunk.value.byteLength,url);
                }
              }finally{reader.releaseLock()}
              blob=new Blob(chunks,{type:mimeType});
            }
            if(typeof expectedBytes!=="number"&&chunkBytes>0&&(!enc||enc==="identity")&&headerLen>0&&chunkBytes<headerLen){
              recordBytes(-chunkBytes,url);
              lastError=new Error("Truncated chunk "+url+" ("+chunkBytes+" of "+headerLen+" bytes)");
              continue;
            }
            if(!(await validateDownloadedBlob(url,blob,expectedBytes))){
              recordBytes(-chunkBytes,url);
              lastError=new Error("Corrupted or blocked payload for "+url);
              continue;
            }
            await cacheSet(url,blob);
            return blob;
          }catch(error){
            if(preloadAbort.signal.aborted)throw error;
            lastError=error;
          }
        }
        if(round===0)await new Promise(resolve=>setTimeout(resolve,600));
      }
      throw lastError||new Error("Unable to download "+url);
    }
    async function combineParts(baseUrl,count,mimeType,numberWidth=0,expectedTotalBytes=null){
      const partUrls=Array.from({length:count},(_,index)=>baseUrl+".part"+String(index+1).padStart(numberWidth,"0"));
      const blobs=await mapWithConcurrency(partUrls,MAX_CONCURRENT_DOWNLOADS,partUrl=>downloadBlob(partUrl,mimeType));
      const merged=new Blob(blobs,{type:mimeType});
      if(typeof expectedTotalBytes==="number"&&merged.size!==expectedTotalBytes){
        await Promise.all(partUrls.map(cacheDelete));
        throw new Error("Downloaded "+baseUrl.split("/").pop()+" size mismatch ("+merged.size+" vs "+expectedTotalBytes+" bytes)");
      }
      if(mimeType==="application/wasm"){
        const head=new Uint8Array(await merged.slice(0,4).arrayBuffer());
        if(head[0]!==0x00||head[1]!==0x61||head[2]!==0x73||head[3]!==0x6d){
          await Promise.all(partUrls.map(cacheDelete));
          throw new Error("Invalid WebAssembly binary received for "+baseUrl.split("/").pop());
        }
      }
      return merged;
    }
    async function validateAssetCatalog(blob){
      const catalog=JSON.parse(await blob.text());
      const expected=new Set([LARGE_BUNDLE].concat(STREAMING_FILES.filter(file=>file[0].endsWith(".bundle")).map(file=>file[0].split("/").pop())));
      const actual=(catalog.m_InternalIds||[]).filter(id=>id.endsWith(".bundle")).map(id=>id.split("/").pop());
      if(actual.length!==expected.size||actual.some(name=>!expected.has(name)))throw new Error("The asset catalog belongs to a different build. Update the loader and game files together.");
    }
    async function preloadStreamingAssets(){
      await mapWithConcurrency(STREAMING_FILES,MAX_CONCURRENT_DOWNLOADS,async file=>{
        const url=STREAMING_ASSETS+"/"+file[0];
        const blob=await downloadBlob(url,file[2],file[1]);
        if(file[0]==="aa/catalog.json")await validateAssetCatalog(blob);
        assetUrls.set(assetKey(url),URL.createObjectURL(blob));
      });
      const bundle=await combineParts(STREAMING_ASSETS+"/aa/WebGL/"+LARGE_BUNDLE,34,"application/octet-stream",2,EXPECTED_BUNDLE_BYTES);
      assetUrls.set(assetKey(STREAMING_ASSETS+"/aa/WebGL/"+LARGE_BUNDLE),URL.createObjectURL(bundle));
    }
    window.fetch=function(resource,options){const cachedUrl=assetUrls.get(assetKey(resourceUrl(resource)));return cachedUrl?externalFetch(cachedUrl,resource,options):fetchWithFallback(resource,options)};
    window.XMLHttpRequest=function(){
      const xhr=new BrowserXMLHttpRequest();
      const originalOpen=xhr.open;
      const originalSetRequestHeader=xhr.setRequestHeader;
      let externalGet=false;
      xhr.open=function(method,url){
        const target=assetUrls.get(assetKey(String(url)))||rewriteToServer(String(url),false);
        externalGet=/^(GET|HEAD)$/i.test(method)&&(target.startsWith(JSDELIVR+"/")||target.startsWith(WORKER_CDN_PROXY)||target.startsWith("blob:"));
        const args=Array.prototype.slice.call(arguments);args[1]=target;return originalOpen.apply(xhr,args);
      };
      xhr.setRequestHeader=function(name,value){if(externalGet&&!/^(accept|accept-language|range)$/i.test(String(name)))return;return originalSetRequestHeader.call(xhr,name,value)};
      return xhr;
    };
    window.XMLHttpRequest.prototype=BrowserXMLHttpRequest.prototype;
    if(serverReplacement){
      const BrowserWebSocket=window.WebSocket;
      window.WebSocket=function(url,protocols){const target=rewriteToServer(url,true);return protocols!==undefined?new BrowserWebSocket(target,protocols):new BrowserWebSocket(target)};
      window.WebSocket.prototype=BrowserWebSocket.prototype;
    }
    async function executeUnityLoader(blob){
      const script=document.createElement("script");
      const url=URL.createObjectURL(blob);
      script.src=url;
      try{await new Promise((resolve,reject)=>{script.onload=resolve;script.onerror=()=>reject(new Error("Unity loader could not be executed."));document.head.appendChild(script)})}
      finally{URL.revokeObjectURL(url)}
    }
    async function start(){
      renderDownloadProgress();
      const [dataBlob,wasmBlob,loaderBlob,frameworkBlob]=await Promise.all([
        finishDownloadGroup("data",combineParts(BUILD+"/AmongUsWeb.data",6,"application/octet-stream",0,EXPECTED_DATA_BYTES)),
        finishDownloadGroup("wasm",combineParts(BUILD+"/AmongUsWeb.wasm",9,"application/wasm",0,EXPECTED_WASM_BYTES)),
        downloadBlob(BUILD+"/AmongUsWeb.loader.js","text/javascript",20642),
        downloadBlob(BUILD+"/AmongUsWeb.framework.js","text/javascript",523455),
        finishDownloadGroup("assets",preloadStreamingAssets())
      ]);
      if(progressFrame!==null){cancelAnimationFrame(progressFrame);progressFrame=null}
      renderDownloadProgress();
      statusText.textContent="Starting game… 0%";
      await executeUnityLoader(loaderBlob);
      const config={
        dataUrl:URL.createObjectURL(dataBlob),
        frameworkUrl:URL.createObjectURL(frameworkBlob),
        codeUrl:URL.createObjectURL(wasmBlob),
        streamingAssetsUrl:STREAMING_ASSETS,
        cacheControl:()=>"no-store",
        companyName:"Innersloth",
        productName:"Among Us",
        productVersion:"2026.6.5",
        showBanner:(message,type)=>type==="error"?errorText.textContent=message:console.warn(message)
      };
      await createUnityInstance(canvas,config,value=>{statusText.textContent="Starting game… "+Math.floor(Math.max(0,Math.min(1,value))*100)+"%"});
      loader.style.display="none";
    }
    start().catch(error=>{
      loadingFailed=true;
      preloadAbort.abort();
      if(progressFrame!==null)cancelAnimationFrame(progressFrame);
      statusText.textContent="Unable to start the game.";
      errorText.textContent=error&&error.message?error.message:String(error);
      console.error(error);
    });
  </script>
</body>
</html>
