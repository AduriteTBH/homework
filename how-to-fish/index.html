<!DOCTYPE html>
<html lang="en-us">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
<title>How to Fish</title>
<style>

#unity-container {position:absolute;top:0;left:0;width:100%;height:100%;transform:none}

#unity-error {position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);display:none;max-width:80%;text-align:center;font-family:arial,sans-serif;font-size:13px;color:#d97070;line-height:1.5}
</style>
</head>
<body>
<div id="unity-container"><canvas id="unity-canvas" tabindex="-1"></canvas><div id="unity-loading-bar"><div id="unity-progress-bar-empty"><div id="unity-progress-bar-full"></div></div><div id="unity-status"></div></div><div id="unity-warning"></div><div id="unity-error"></div></div>
<script>
var container=document.querySelector("#unity-container"),canvas=document.querySelector("#unity-canvas"),loadingBar=document.querySelector("#unity-loading-bar"),progressBarFull=document.querySelector("#unity-progress-bar-full"),statusText=document.querySelector("#unity-status"),warningBanner=document.querySelector("#unity-warning"),errorBox=document.querySelector("#unity-error");
function showError(msg){loadingBar.style.display="none";errorBox.style.display="block";errorBox.innerHTML=msg}
window.alert=function(m){console.warn("[unity]",m)};unityShowBanner=function(msg,type){console.warn("[unity "+(type||"info")+"]",msg)};
var repoBase="https://cdn.jsdelivr.net/gh/NotRexed/HowToFishPort@main/",buildUrl=repoBase+"Build",loaderUrl=buildUrl+"/WebGL.loader.js",frameworkUrl=buildUrl+"/WebGL.framework.js",dataUrl=buildUrl+"/WebGL.data",wasmUrl=buildUrl+"/WebGL.wasm";
var MAX_PARTS=128,objectUrls=[];
function basename(url){return url.split("/").pop()}
async function probeSize(url){try{var head=await fetch(url,{method:"HEAD"});if(head.ok){var len=parseInt(head.headers.get("content-length")||"0",10);return isNaN(len)?0:len}if(head.status===404)return -1}catch(e){}try{var res=await fetch(url,{headers:{Range:"bytes=0-0"}});if(!res.ok&&res.status!==206)return -1;var cr=res.headers.get("content-range");if(cr&&cr.indexOf("/")!==-1){var total=parseInt(cr.split("/")[1],10);if(!isNaN(total))return total}return 0}catch(e){return -1}}
async function discoverParts(url){var schemes=[function(i){return url+".part"+(i+1)},function(i){return url+"."+String(i).padStart(3,"0")},function(i){return url+".part"+String(i+1).padStart(3,"0")}];for(var s=0;s<schemes.length;s++){var naming=schemes[s],first=await probeSize(naming(0));if(first<0)continue;var parts=[{url:naming(0),size:first}];for(var i=1;i<MAX_PARTS;i++){var size=await probeSize(naming(i));if(size<0)break;parts.push({url:naming(i),size:size})}return parts}return []}
async function fetchPartBlob(url,onBytes){var res=await fetch(url);if(!res.ok)throw new Error("Failed to fetch "+url+" (HTTP "+res.status+")");if(!res.body||!res.body.getReader){var buf=await res.arrayBuffer();onBytes(buf.byteLength);return new Blob([buf])}var reader=res.body.getReader(),chunks=[];for(;;){var step=await reader.read();if(step.done)break;chunks.push(step.value);onBytes(step.value.length)}return new Blob(chunks)}
async function resolveUrl(url,mimeType,plan,onBytes,onFile){var parts=plan[url];if(!parts||!parts.length)return url;var blobs=[];for(var i=0;i<parts.length;i++){onFile(basename(parts[i].url));blobs.push(await fetchPartBlob(parts[i].url,onBytes))}var objUrl=URL.createObjectURL(new Blob(blobs,{type:mimeType}));objectUrls.push(objUrl);return objUrl}
async function fetchAsScriptBlob(url){statusText.textContent=basename(url);var res=await fetch(url);if(!res.ok)throw new Error("Failed to fetch "+url+" (HTTP "+res.status+")");var text=await res.text(),objUrl=URL.createObjectURL(new Blob([text],{type:"text/javascript"}));objectUrls.push(objUrl);return objUrl}
async function boot(){loadingBar.style.display="block";statusText.textContent="Checking files...";var plan={};plan[dataUrl]=await discoverParts(dataUrl);plan[wasmUrl]=await discoverParts(wasmUrl);if(!plan[dataUrl].length&&(await probeSize(dataUrl))<0)throw new Error("Could not find WebGL.data or any of its parts in the repo.");if(!plan[wasmUrl].length&&(await probeSize(wasmUrl))<0)throw new Error("Could not find WebGL.wasm or any of its parts in the repo.");var totalBytes=0;Object.keys(plan).forEach(function(k){plan[k].forEach(function(p){totalBytes+=p.size})});var loadedBytes=0,currentFile="";function onBytes(n){loadedBytes+=n;if(totalBytes>0){var frac=Math.min(loadedBytes/totalBytes,1);progressBarFull.style.width=(frac*90)+"%";statusText.textContent=currentFile+" - "+Math.round(frac*100)+"%"}}function onFile(name){currentFile=name;statusText.textContent=currentFile}var resolvedWasm=await resolveUrl(wasmUrl,"application/wasm",plan,onBytes,onFile),resolvedData=await resolveUrl(dataUrl,"application/octet-stream",plan,onBytes,onFile),resolvedLoader=await fetchAsScriptBlob(loaderUrl),resolvedFramework=await fetchAsScriptBlob(frameworkUrl);statusText.textContent="Starting...";var config={dataUrl:resolvedData,frameworkUrl:resolvedFramework,codeUrl:resolvedWasm,streamingAssetsUrl:repoBase+"StreamingAssets",companyName:"DefaultCompany",productName:"ExportedProject",productVersion:"1.0",showBanner:unityShowBanner,autoSyncPersistentDataPath:true};if(/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)){container.className="unity-mobile";canvas.className="unity-mobile"}await new Promise(function(resolve,reject){var script=document.createElement("script");script.src=resolvedLoader;script.onload=resolve;script.onerror=function(){reject(new Error("Failed to load "+loaderUrl))};document.body.appendChild(script)});var unityInstance=await createUnityInstance(canvas,config,function(progress){progressBarFull.style.width=(90+progress*10)+"%"});window.unityInstance=unityInstance;loadingBar.style.display="none";objectUrls.forEach(function(u){URL.revokeObjectURL(u)});objectUrls=[];window.addEventListener("keydown",function(e){if((e.key==="F"||e.key==="f")&&(e.target===document.body||e.target===canvas))unityInstance.SetFullscreen(1)})}
boot().catch(function(err){showError("<b>Failed to start.</b><br>"+(err&&err.message?err.message:err));console.error(err)});
</script>
</body>
</html>
