<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Madalin Stunt Cars 3</title>
    <link rel="icon" type="image/x-icon" href="img/index.jpg">
    <link rel="stylesheet" href="TemplateData/style.css">
    <script src="TemplateData/UnityProgress.js"></script>
    <script src="js/unityloader35.js"></script>
  </head>
  <body>
    <script>
      const unlockAudio = () => {
        if (typeof WEBAudio !== "undefined" && WEBAudio.audioContext && WEBAudio.audioContext.state === "suspended") {
          WEBAudio.audioContext.resume();
        }
        ["click", "keydown", "touchstart"].forEach(evt => window.removeEventListener(evt, unlockAudio));
      };
      ["click", "keydown", "touchstart"].forEach(evt => window.addEventListener(evt, unlockAudio, { passive: true }));

      var gameInstance = UnityLoader.instantiate("gameContainer", "game.json", {
        onProgress: UnityProgress,
        Module: {
          onRuntimeInitialized: function () {
            UnityProgress(gameInstance, "complete");
          }
        }
      });
    </script>
    <div class="webgl-content">
      <div id="gameContainer" style="width: 100%; height: 100%; margin: auto;"></div>
    </div>
  </body>
</html>
