<!DOCTYPE html><html lang="en-us"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,height=device-height,initial-scale=1.0,user-scalable=no"><title>Clustertruck</title><style>html,body{width:100%;height:100%;margin:0;padding:0;overflow:hidden;background:#000}#unity-container{position:absolute;inset:0;width:100%;height:100%}#unity-canvas{display:block;width:100%;height:100%;background:#000;outline:none}#unity-loading-bar{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:280px}#unity-progress-bar-empty{width:100%;height:4px;background:#333;border-radius:2px;overflow:hidden}#unity-progress-bar-full{width:0;height:100%;background:#fff}#unity-status{text-align:center;font:12px Arial;color:#999;margin-top:10px}</style></head><body><div id="unity-container"><canvas id="unity-canvas" tabindex="-1"></canvas><div id="unity-loading-bar"><div id="unity-progress-bar-empty"><div id="unity-progress-bar-full"></div></div><div id="unity-status">Loading…</div></div></div><script>const canvas=document.querySelector('#unity-canvas'),loading=document.querySelector('#unity-loading-bar'),bar=document.querySelector('#unity-progress-bar-full'),status=document.querySelector('#unity-status');const repo='https://raw.githubusercontent.com/wasmdotrip/Clustertruck-Port/main/Build';const loader=repo+'/ClusterTruckWEB.loader.js',data=repo+'/ClusterTruckWEB.data',wasm=repo+'/ClusterTruckWEB.wasm',framework=repo+'/ClusterTruckWEB.framework.js';async function head(u){try{const r=await fetch(u,{method:'HEAD'});return r.ok?r:null}catch(e){return null}}async function parts(u){const a=[];for(let i=1;i<=128;i++){const r=await head(u+'.part'+i);if(!r)break;a.push(u+'.part'+i)}return a}async function get(u,partsList,type){if(!partsList.length)return u;const bufs=[];for(let i=0;i<partsList.length;i++){status.textContent='Loading '+(i+1)+'/'+partsList.length;const r=await fetch(partsList[i]);if(!r.ok)throw Error('Failed to load '+partsList[i]);bufs.push(await r.arrayBuffer())}return URL.createObjectURL(new Blob(bufs,{type}))}async function scriptBlob(u){const r=await fetch(u);if(!r.ok)throw Error('Failed to load '+u);return URL.createObjectURL(new Blob([await r.text()],{type:'text/javascript'}))}async function boot(){const dp=await parts(data),wp=await parts(wasm);const rd=await get(data,dp,'application/octet-stream'),rw=await get(wasm,wp,'application/wasm'),rl=await scriptBlob(loader),rf=await scriptBlob(framework);const s=document.createElement('script');s.src=rl;s.onload=async()=>{try{const inst=await createUnityInstance(canvas,{dataUrl:rd,frameworkUrl:rf,codeUrl:rw,streamingAssetsUrl:'https://raw.githubusercontent.com/wasmdotrip/Clustertruck-Port/main/StreamingAssets',companyName:'Landfall',productName:'Clustertruck',productVersion:'1.0'},p=>bar.style.width=(p*100)+'%');loading.style.display='none';window.addEventListener('keydown',e=>{if((e.key==='f'||e.key==='F')&&document.activeElement===canvas)inst.SetFullscreen(1)})}catch(e){status.textContent='Failed to start: '+e.message}};s.onerror=()=>status.textContent='Failed to load Unity loader';document.body.appendChild(s)}boot().catch(e=>status.textContent='Failed to start: '+e.message)</script></body></html>
