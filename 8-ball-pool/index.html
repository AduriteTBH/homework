<!DOCTYPE html>
<html>
<head>
    <meta content="text/html;charset=utf-8" http-equiv="Content-Type">
    <meta content="utf-8" http-equiv="encoding">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, minimal-ui" />
    <title>8 Ball Billiards Classic</title>
    <style>html,body{background:#000;margin:0;padding:0;overflow:hidden;width:100%;height:100%}#mygame{width:100%;height:100%}</style>
    <script>
       window.famobi_analytics = new Proxy({}, { get: function() { return function() { return Promise.resolve(); }; } });
       var famobiBase = {
           getVolume: function() { return 1; },
           getOrientation: function() { return window.innerWidth > window.innerHeight ? 'landscape' : 'portrait'; },
           getBrandingButtonImage: function() { return "data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"; },
           moreGamesLink: function() { return ""; },
           onOrientationChange: function(cb) { window.addEventListener("resize", cb); },
           localStorage: window.localStorage || {}, log: function() {},
           config: { features: {}, aid: "offline" }, hasFeature: function() { return true; },
           __ : function(str) { return str; }, menuConfig: {}
       };
       window.famobi = new Proxy(famobiBase, { get: function(target, prop) { if (prop in target) return target[prop]; return function(callback) { if (typeof callback === 'function') setTimeout(callback, 100); return Promise.resolve(); }; } });
       window.fenster = window; window.fenster.subscribeToOffsetUpdates = function() {};
    </script>
</head>
<body>
<div id="mygame"></div>
<script src="https://cdn.jsdelivr.net/gh/thirstygithub/shiny-disco@main/src/01phaser.js"></script>
<script>
(function(){
    var originals={
      image:Phaser.Loader.prototype.image,audio:Phaser.Loader.prototype.audio,spritesheet:Phaser.Loader.prototype.spritesheet,
      bitmapFont:Phaser.Loader.prototype.bitmapFont,atlasJSONHash:Phaser.Loader.prototype.atlasJSONHash,
      atlasJSONArray:Phaser.Loader.prototype.atlasJSONArray,atlas:Phaser.Loader.prototype.atlas,json:Phaser.Loader.prototype.json,
      xml:Phaser.Loader.prototype.xml,text:Phaser.Loader.prototype.text
    };
    var CDN="https://cdn.jsdelivr.net/gh/thirstygithub/shiny-disco@main/";
    function rewrite(url){ return typeof url==='string' && url.startsWith('assets/') ? CDN+url.replace('assets/','') : url; }
    Phaser.Loader.prototype.image=function(k,u){return originals.image.call(this,k,rewrite(u));};
    Phaser.Loader.prototype.audio=function(k,u){return originals.audio.call(this,k,Array.isArray(u)?u.map(rewrite):rewrite(u));};
    Phaser.Loader.prototype.spritesheet=function(k,u,w,h,f,m,s){return originals.spritesheet.call(this,k,rewrite(u),w,h,f,m,s);};
    Phaser.Loader.prototype.bitmapFont=function(k,t,a,d,x,y){return originals.bitmapFont.call(this,k,rewrite(t),rewrite(a),d,x,y);};
    Phaser.Loader.prototype.atlasJSONHash=function(k,t,a,d){return originals.atlasJSONHash.call(this,k,rewrite(t),rewrite(a),d);};
    if(originals.atlasJSONArray)Phaser.Loader.prototype.atlasJSONArray=function(k,t,a,d){return originals.atlasJSONArray.call(this,k,rewrite(t),rewrite(a),d);};
    if(originals.atlas)Phaser.Loader.prototype.atlas=function(k,t,a,d,f){return originals.atlas.call(this,k,rewrite(t),rewrite(a),d,f);};
    if(originals.json)Phaser.Loader.prototype.json=function(k,u,o){return originals.json.call(this,k,rewrite(u),o);};
    if(originals.xml)Phaser.Loader.prototype.xml=function(k,u,o){return originals.xml.call(this,k,rewrite(u),o);};
    if(originals.text)Phaser.Loader.prototype.text=function(k,u,o){return originals.text.call(this,k,rewrite(u),o);};
})();
</script>
</body>
</html>
