    <rect x="18" y="48" width="76" height="22" rx="10" fill="url(#body)" stroke="#a0aec0" stroke-width="1.5"/>
    <rect x="82" y="52" width="28" height="14" rx="4" fill="#718096"/>
    <rect x="4" y="52" width="18" height="10" rx="3" fill="#4a5568"/>
    <circle cx="56" cy="56" r="10" fill="#1a202c" stroke="#5ecfff" stroke-width="1.5"/>
    <line x1="56" y1="46" x2="56" y2="66" stroke="#cbd5e0" stroke-width="2" stroke-linecap="round"/>
    <line x1="46" y1="56" x2="66" y2="56" stroke="#cbd5e0" stroke-width="2" stroke-linecap="round"/>
  </g>
  <!-- Wordmark -->
  <text x="148" y="72" font-family="Outfit,Segoe UI,sans-serif" font-size="52" font-weight="800" fill="#ffffff" letter-spacing="6">HOPTER</text>
  <text x="148" y="118" font-family="Outfit,Segoe UI,sans-serif" font-size="44" font-weight="700" fill="#5ecfff" letter-spacing="10">ROYALE</text>
  <text x="150" y="142" font-family="Outfit,Segoe UI,sans-serif" font-size="11" font-weight="600" fill="#7d8796" letter-spacing="4">H&amp;H INC � AERIAL COMBAT</text>
